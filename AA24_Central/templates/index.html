<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AA24 - AlgarveAssist 24</title>
    <link rel="icon" href="/favicon.ico" type="image/png">
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: white; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; }
        .logo { max-width: 200px; max-height: 100px; margin-bottom: 15px; object-fit: contain; }
        .btn { padding: 20px 30px; font-size: 18px; font-weight: bold; border: none; border-radius: 10px; cursor: pointer; margin: 10px; }
        .btn-chamado { background: #ff9800; color: black; }
        .btn-ponto { background: #2196F3; color: white; }
        .active { border: 4px solid white; box-shadow: 0 0 15px white; }
        .card { background: #1e1e1e; padding: 15px; border-radius: 8px; margin-top: 20px; text-align: left; border-left: 5px solid #ff9800; }
        #rfid_input { width: 80%; padding: 12px; font-size: 18px; margin-top: 20px; text-align: center; border-radius: 5px; border: 1px solid #444; background: #222; color: #fff; }
        #status { font-size: 20px; margin-top: 20px; color: #4CAF50; font-weight: bold; word-break: break-word; }
    </style>
</head>
<body>

<div class="container">
    <img src="{{ url_for('static', filename='logo.png') }}" alt="AlgarveAssist 24" class="logo" onerror="this.style.display='none'">

    <h2>ALGARVEASSIST 24 — PAINEL DE DESPACHO</h2>

    <div>
        <button id="btnChamado" class="btn btn-chamado active" onclick="setModo('CHAMADO')">🚀 ASSUMIR CHAMADO</button>
        <button id="btnPonto" class="btn btn-ponto" onclick="setModo('PONTO')">⏱️ ENTRADA / SAÍDA</button>
    </div>

    <div id="lista-chamados">
        {% for o in ocorrencias %}
        <div class="card">
            <h3>🚨 Emergência #{{ o.id }} ({{ o.estado }})</h3>
            <p><strong>Cliente:</strong> {{ o.cliente }} | {{ o.contacto }}</p>
            <p><strong>Serviço:</strong> {{ o.servico }}</p>
            <p><strong>Local:</strong> {{ o.local }}</p>
        </div>
        {% endfor %}
    </div>

    <br>
    <label>Simulador de Leitor RFID (Digita o código e prime Enter):</label><br>
    <input type="text" id="rfid_input" placeholder="Ex: 0008392104" autofocus>

    <div id="status">👉 Seleciona a opção e insere o código do cartão</div>
</div>

<script>
    let modoAtual = 'CHAMADO';
    let servicoSelecionado = 104;
    const rfidInput = document.getElementById('rfid_input');

    function setModo(modo) {
        modoAtual = modo;
        document.getElementById('btnChamado').classList.toggle('active', modo === 'CHAMADO');
        document.getElementById('btnPonto').classList.toggle('active', modo === 'PONTO');
        rfidInput.focus();
    }

    rfidInput.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            const tag = this.value;
            this.value = '';

            fetch('/processar_rfid', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ rfid_tag: tag, modo: modoAtual, id_servico: servicoSelecionado })
            })
            .then(res => res.json())
            .then(data => {
                document.getElementById('status').innerText = data.mensagem;
                if(data.status === 'error') {
                    document.getElementById('status').style.color = '#f44336';
                } else {
                    document.getElementById('status').style.color = '#4CAF50';
                }
            });
        }
    });
</script>

</body>
</html>
